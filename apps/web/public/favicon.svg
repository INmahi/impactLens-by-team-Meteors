<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- ImpactLens: a lens over a rising trend line. Flat, no glow. -->
  <rect width="32" height="32" rx="7" fill="#0d0d0e"/>
  <clipPath id="lens"><circle cx="13.5" cy="13.5" r="7.2"/></clipPath>
  <polyline points="6,18.5 10.5,15.5 13.5,16.8 19.5,10" fill="none" stroke="#fcd34d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#lens)"/>
  <circle cx="13.5" cy="13.5" r="8.2" fill="none" stroke="#fff" stroke-width="2.6"/>
  <line x1="19.6" y1="19.6" x2="25.5" y2="25.5" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
</svg>
